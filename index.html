<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Unordered List:</h2>
    <p>Shopping List:</p>
    <ul>
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Sugar</li>
        <li>Tea</li>
    </ul>
    <h2>Ordered List:</h2>
    <p>How to make tea:</p>
    <ol>
        <li>Boil water</li>
        <li>Add tea leaves</li>
        <li>Add sugar</li>
        <li>Add milk</li>
        <li>Serve hot</li>
    </ol>
    <h2>Definition List:</h2>
    <dl>
        <dt>HTML:</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS:</dt>
        <dd>Cascading Style Sheets</dd>
        <dt>JS:</dt>
        <dd>JavaScript</dd>
    </dl>

</body>
</html>
